<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ea580c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#0f172a"/>

  <!-- Lab beaker/flask shape (left side) -->
  <path d="M 25 30 L 25 45 L 20 60 Q 20 65 25 65 L 40 65 Q 45 65 45 60 L 40 45 L 40 30 Z"
        fill="none" stroke="url(#gradMain)" stroke-width="2.5" opacity="0.9"/>

  <!-- Liquid in beaker -->
  <path d="M 22 55 Q 22 62 27 62 L 38 62 Q 43 62 43 55 L 41 48 L 24 48 Z"
        fill="url(#gradMain)" opacity="0.3"/>

  <!-- Molecular structure dots -->
  <circle cx="28" cy="52" r="2" fill="#ea580c"/>
  <circle cx="35" cy="56" r="2" fill="#f97316"/>
  <circle cx="32" cy="50" r="1.5" fill="#fbbf24"/>

  <!-- Code brackets (right side) -->
  <path d="M 55 35 L 48 50 L 55 65"
        fill="none" stroke="url(#gradAccent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 75 35 L 82 50 L 75 65"
        fill="none" stroke="url(#gradAccent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Forward slash between brackets -->
  <line x1="68" y1="35" x2="62" y2="65"
        stroke="url(#gradMain)" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Connection line between lab and code -->
  <line x1="45" y1="50" x2="48" y2="50"
        stroke="#64748b" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.5"/>
</svg>
